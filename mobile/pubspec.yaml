name: group_chat_court
description: "Group Chat Court — settle harmless friend-group disputes with a comedy AI verdict."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  go_router: ^14.2.7
  share_plus: ^12.0.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  web_socket_channel: ^3.0.3
  stream_channel: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Bundled rather than fetched at runtime: the court looks the same on a phone
  # with no signal as it does on wifi, and nothing phones home to render a
  # heading. One family, like the reference design and the web app.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-300.ttf
          weight: 300
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700

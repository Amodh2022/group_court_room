name: group_chat_court
description: "Sue Me — settle harmless friend-group disputes with a comedy AI verdict."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  dio: ^5.7.0
  go_router: ^14.2.7
  share_plus: ^12.0.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  web_socket_channel: ^3.0.3
  stream_channel: ^2.1.4
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Bundled rather than fetched at runtime: the app looks the same with no
  # signal as it does on wifi. One variable family, like the design canvas.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
          weight: 400
        - asset: assets/fonts/Outfit.ttf
          weight: 500
        - asset: assets/fonts/Outfit.ttf
          weight: 600
        - asset: assets/fonts/Outfit.ttf
          weight: 700
        - asset: assets/fonts/Outfit.ttf
          weight: 800
